# بناءُ نسخة ويندوز ونشرُها في GitHub Releases عند دفع وسمٍ يبدأ بـ v (مثل v1.2.0).
#
# ما يحتاجه المستودع:
#   • لا شيء إلزاميّ. GITHUB_TOKEN يوفّره GitHub تلقائياً (الصلاحية contents: write أدناه).
#   • اختياري — التوقيع الرقمي (Settings ← Secrets and variables ← Actions ← Repository secrets):
#       CSC_LINK          ملفّ الشهادة .pfx/.p12 مُشفَّراً base64 (أو رابط https إليه)
#       CSC_KEY_PASSWORD  كلمة مرور الشهادة
#     إن غاب السرّان يُبنى exe بلا توقيع ويستمرّ العمل (مع تحذير). وإن وُجد أحدهما دون الآخر يفشل البناء.
#   • لا يُكتب أيُّ سرٍّ في هذا الملف ولا في المستودع: يُقرأ من secrets فقط، ويُخفيه GitHub من السجلّ.
#
# الإصدار يُنشَر «مسوّدة» (draft) عمداً: تفحص الملفّات ثم تضغط Publish.
# المسوّدة لا يراها محدِّث البرنامج؛ النشرُ هو الذي يطلق التحديث للمستخدمين. التفاصيل: RELEASE.md
name: Release (Windows)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # "true": الإصدار مسوّدة تنشرها يدوياً · "false": يُنشَر فوراً ويصل المستخدمين
  RELEASE_DRAFT: "true"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: الوسم يطابق إصدار package.json
        run: |
          PKG="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG  tag=$TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::الوسم ($GITHUB_REF_NAME) لا يطابق version في package.json ($PKG). عدّل الإصدار (وjs/core/version.js) ثم أعد الوسم."
            exit 1
          fi

      # npm install لا npm ci: لا يوجد package-lock.json بعد. أضِفه إلى المستودع ثم بدّل إلى npm ci.
      - name: تثبيت الاعتماديات
        run: npm install --no-audit --no-fund

      # بوّابة الإصدار: فحوصُ غلاف سطح المكتب والتغليف والنشر.
      # (npm test الكامل فيه الآن اختبارٌ فاشلٌ قديم: section-poche.test.js — بدّل هذا السطر بـ npm test بعد إصلاحه)
      - name: فحوص ما قبل البناء
        run: |
          npm run check:desktop
          npm run test:deploy
          npm run test:release
          npm run test:updater
          node js/tests/packaging.test.js
          node js/tests/desktop.test.js

      - name: هل يوجد توقيع رقمي؟
        id: sign
        env:
          HAS_LINK: ${{ secrets.CSC_LINK != '' }}
          HAS_PASS: ${{ secrets.CSC_KEY_PASSWORD != '' }}
        run: |
          if [ "$HAS_LINK" = "true" ] && [ "$HAS_PASS" = "true" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "التوقيع الرقمي: مفعّل"
          elif [ "$HAS_LINK" = "true" ] || [ "$HAS_PASS" = "true" ]; then
            echo "::error::أحد السرّين CSC_LINK / CSC_KEY_PASSWORD موجود والآخر غائب. أكمل الزوج أو احذف الاثنين."
            exit 1
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::لا CSC_LINK/CSC_KEY_PASSWORD: سيُبنى exe بلا توقيع (سيُظهر ويندوز تحذير SmartScreen)."
          fi

      - name: بناء dist (يتحقّق من sw.js أولاً)
        run: npm run build

      # publish=never: لا يرفع electron-builder شيئاً بنفسه (الرفع في الخطوة الأخيرة)،
      # لكنّ إعداد publish يجعله يولّد latest.yml وapp-update.yml اللذين يحتاجهما المحدِّث.
      - name: تغليف exe (مثبّت + محمول، x64)
        env:
          CSC_LINK: ${{ steps.sign.outputs.signed == 'true' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ steps.sign.outputs.signed == 'true' && secrets.CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: >
          npx electron-builder --win --publish never
          -c.publish.provider=github
          -c.publish.owner=${{ github.repository_owner }}
          -c.publish.repo=${{ github.event.repository.name }}

      - name: التحقّق من التوقيع
        if: steps.sign.outputs.signed == 'true'
        shell: pwsh
        run: |
          $bad = $false
          Get-ChildItem release/*.exe | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            "$($_.Name): $($s.Status)"
            if ($s.Status -in 'NotSigned','HashMismatch') { $bad = $true }
          }
          if ($bad) { throw "ملفٌّ غير موقَّع أو تالف التوقيع — راجع الشهادة وكلمة المرور." }

      - name: تقرير الأحجام وSHA256
        run: |
          npm run release:info
          npm run release:info -- --sums

      - name: التحقّق من وجود ملفّات التحديث
        run: |
          test -f release/latest.yml || { echo "::error::لم يُولَّد release/latest.yml — المحدِّث لن يعمل."; exit 1; }
          ls -la release

      - name: رفع الملفّات إلى GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ env.RELEASE_DRAFT == 'true' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
