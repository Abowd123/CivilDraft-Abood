name: Unpack project zip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: فك الضغط ونقل الملفات إلى جذر المستودع
        run: |
          set -e
          test -f CivilDraft-final.zip || { echo "::error::ارفع CivilDraft-final.zip إلى جذر المستودع أولاً"; exit 1; }
          rm -rf /tmp/x && mkdir /tmp/x
          unzip -q CivilDraft-final.zip -d /tmp/x
          PKG="$(find /tmp/x -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -n 1)"
          if [ -z "$PKG" ]; then
            echo "::error::لم أجد package.json داخل الـ zip. هذا محتواه:"
            find /tmp/x -maxdepth 2 | head -40
            exit 1
          fi
          SRC="$(dirname "$PKG")"
          echo "المشروع موجود في: $SRC"
          rm -rf CivilDraft
          tar -C "$SRC" --exclude=./.github -cf - . | tar -xf -
          rm -f CivilDraft-final.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "CivilDraft 1.1.0"
          git push
